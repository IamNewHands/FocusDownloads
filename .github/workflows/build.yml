name: build-dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dylib:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Python packaging regression
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Foundation native regression
        id: foundation
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun --sdk macosx clang -fobjc-arc -fblocks -Wall -Wextra \
            -DFDM_TESTING=1 -Isrc \
            -framework Foundation -framework Security \
            src/FDMCommon.m src/FDMStore.m src/FDMJSON.m src/FDMPolicy.m \
            src/FDMIntent.m src/FDMVault.m src/FDMBackup.m src/FDMEngine.m src/FDMHostDownloads.m \
            tests/native_main.m tests/engine_regression.m tests/host_regression.m \
            tests/owner_edge_regression.m tests/malformed_regression.m tests/contract_regression.m \
            -o build/foundation-regression
          build/foundation-regression

      - name: Backup native SQLite regression
        id: backup
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -fobjc-arc -fblocks -Wall -Wextra \
            -DFDM_TESTING=1 -DFDM_BACKUP_REGRESSION_MAIN=1 -Isrc \
            -framework Foundation -lsqlite3 \
            src/FDMCommon.m src/FDMJSON.m src/FDMPolicy.m src/FDMBackup.m src/FDMBackupSQL.m src/FDMBackupRecovery.m src/FDMBackupReadBarrier.m \
            src/FDMBackupRepositoryBookmarks.m src/FDMBackupRepositorySearch.m \
            src/FDMBackupRepositoryPreferences.m src/FDMBackupRepositoryScripts.m \
            src/FDMBackupRepositoryPolicy.m src/FDMBackupCoordinator.m \
            tests/backup_regression.m -o build/backup-regression
          build/backup-regression

      - name: UIKit icon regression in simulator
        id: uikit
        continue-on-error: true
        run: python3 tests/run_icons_simulator.py

      - name: WebKit navigation and original request regression
        id: webkit
        continue-on-error: true
        run: python3 tests/run_navigation_simulator.py

      - name: Build all arm64 modules
        id: arm64
        continue-on-error: true
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=14.0 -isysroot "$SDK" \
            -fobjc-arc -fblocks -O2 -Wall -Wextra \
            -DFDM_PATCH_VERSION='"v20"' \
            -DFDM_BUILD_REVISION='"'"$GITHUB_SHA"'"' \
            -dynamiclib \
            -install_name @executable_path/Frameworks/FocusDM.dylib \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            -framework ImageIO -framework QuickLook -framework WebKit -framework Security \
            -o build/FocusDM.dylib src/*.m
          lipo -info build/FocusDM.dylib
          shasum -a 256 build/FocusDM.dylib

      - name: Require every native verification target
        if: always()
        run: |
          test '${{ steps.foundation.outcome }}' = success
          test '${{ steps.backup.outcome }}' = success
          test '${{ steps.uikit.outcome }}' = success
          test '${{ steps.webkit.outcome }}' = success
          test '${{ steps.arm64.outcome }}' = success

      - name: Verify compiled provenance
        run: |
          set -euo pipefail
          python3 tools/provenance.py \
            --library build/FocusDM.dylib \
            --source-root "$GITHUB_WORKSPACE" \
            --source-sha "$GITHUB_SHA" --patch-version v20 \
            --output build/FocusDM.provenance.json

      - uses: actions/upload-artifact@v4
        with:
          name: FocusDM-v20-${{ github.sha }}
          path: |
            build/FocusDM.dylib
            build/FocusDM.provenance.json
          if-no-files-found: error

      - name: Generate release checksums
        run: |
          set -euo pipefail
          (cd build && shasum -a 256 FocusDM.dylib FocusDM.provenance.json > SHA256SUMS.txt)
          cat build/SHA256SUMS.txt

      - name: Publish the single nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nightly"
          title="FocusDownloads nightly (run #$GITHUB_RUN_NUMBER)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          notes=$(printf 'FocusDownloads nightly build of `%s`.\n\n- Built at: %s\n- Run: [run #%s](%s)\n- Commit: `%s`\n' "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_NUMBER" "$run_url" "${GITHUB_SHA:0:7}")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" build/FocusDM.dylib build/FocusDM.provenance.json build/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | "\(.id)\t\(.name)"' |
              while IFS=$'\t' read -r id name; do
                case "$name" in
                  FocusDM.dylib | FocusDM.provenance.json | SHA256SUMS.txt | *.ipa) continue ;;
                esac
                echo "Removing stale asset: $name"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
              done
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=true >/dev/null
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          else
            gh release create "$tag" build/FocusDM.dylib build/FocusDM.provenance.json build/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          fi
